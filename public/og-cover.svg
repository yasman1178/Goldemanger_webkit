<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="جولد ماستر — نظام إدارة محلات الذهب">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c1a38"/>
      <stop offset="0.55" stop-color="#071026"/>
      <stop offset="1" stop-color="#02060f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#d4af37" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.5" stop-color="#e0b64a"/>
      <stop offset="1" stop-color="#a8742a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="0" flood-color="#000" flood-opacity="0.55"/>
      <feDropShadow dx="-3" dy="-4" stdDeviation="0" flood-color="#fff" flood-opacity="0.85"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="24" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glass)"/>

  <g stroke="#d4af37" stroke-opacity="0.14" fill="none" stroke-width="1.5">
    <circle cx="600" cy="285" r="420"/>
    <circle cx="600" cy="285" r="520"/>
    <circle cx="600" cy="285" r="640"/>
  </g>

  <!-- الصفائح الزجاجية -->
  <g opacity="0.5">
    <path d="M-100 540 L1100 60" stroke="#ffffff" stroke-opacity="0.06" stroke-width="90"/>
    <path d="M0 600 L1200 160" stroke="#ffffff" stroke-opacity="0.04" stroke-width="60"/>
  </g>

  <!-- الجوهرة -->
  <g transform="translate(880 268)">
    <circle r="168" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.9"/>
    <circle r="144" fill="#0b1224"/>
    <path d="M0 -104 L75 0 L0 104 L-75 0 Z" fill="url(#gold)" filter="url(#soft)"/>
    <path d="M0 -104 L75 0 L0 104 L-75 0 Z" fill="none" stroke="#ffe9a8" stroke-opacity="0.55" stroke-width="1.5"/>
  </g>

  <!-- GOLDMASTER ثلاثي الأبعاد -->
  <text x="380" y="300" text-anchor="middle" font-family="Cairo, Segoe UI, Tahoma, Arial" font-weight="900" font-size="116" fill="url(#gold)" filter="url(#emboss)" letter-spacing="10">GOLDMASTER</text>

  <g>
    <rect x="168" y="340" width="424" height="60" rx="30" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="380" y="381" text-anchor="middle" font-family="Cairo, Segoe UI, Tahoma, Arial" font-weight="800" font-size="34" fill="url(#gold)">جولد ماستر</text>
  </g>

  <!-- شريط التواصل -->
  <g>
    <rect x="48" y="520" width="1104" height="86" rx="30" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.28"/>
    <text x="90" y="556" font-family="Segoe UI, Tahoma, Arial" font-weight="800" font-size="30" fill="#ffffff">01551702595</text>
    <text x="90" y="590" font-family="Cairo, Segoe UI, Tahoma, Arial" font-weight="600" font-size="19" fill="#ffffff" fill-opacity="0.75">رقم المحل للتواصل — واتساب واتصال مباشر</text>
    <text x="1128" y="575" text-anchor="end" font-family="Cairo, Segoe UI, Tahoma, Arial" font-weight="800" font-size="26" fill="url(#gold)">✦ جودة ودقة في كل قيراط</text>
  </g>
</svg>